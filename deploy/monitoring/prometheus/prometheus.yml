global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: todayit-api
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: ["api:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
