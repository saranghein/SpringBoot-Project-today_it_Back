services:
  nginx:
    volumes:
      - ../nginx/bootstrap.conf.template:/etc/nginx/templates/default.conf.template:ro

  api:
    image: todayit-api:local
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile

  data-worker:
    image: todayit-data-worker:local
    build:
      context: ../..
      dockerfile: deploy/docker/data-worker.Dockerfile
