spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:todayit}
    schemas: ${DB_SCHEMA:todayit}
    create-schemas: true
    locations:
      - classpath:db/migration

todayit:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
scalar:
  enabled: ${OPENAPI_ENABLED:false}
