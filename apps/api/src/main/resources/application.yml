spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 32MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:todayit}
    schemas: ${DB_SCHEMA:todayit}
    create-schemas: true
    locations:
      - classpath:db/migration

todayit:
  file:
    inquiry-max-files: 5
    inquiry-max-total-size: 30MB
    provider: ${FILE_STORAGE_PROVIDER:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      timeout: 30s

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

  email:
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}

    verification:
      code-ttl: 30m
      resend-cooldown: 1m
      max-failure-count: 3
      verification-token-ttl: 30m
      send-window: 10m
      max-send-count: 5
      send-block-duration: 30m

  oauth:
    google:
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/google/callback}

    kakao:
      client-id: ${KAKAO_OAUTH_CLIENT_ID:}
      client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_OAUTH_REDIRECT_URI:http://localhost:3000/oauth/kakao/callback}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
scalar:
  enabled: ${OPENAPI_ENABLED:false}
